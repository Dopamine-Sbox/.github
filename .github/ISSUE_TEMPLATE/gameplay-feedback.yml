name: Gameplay feedback
description: Share playtest feedback for Dopamine-Sbox games
title: "[Gameplay]: "
labels:
  - gameplay
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for similar feedback.
          required: true
        - label: I removed private player identifiers and private server details.
          required: true
  - type: input
    id: game_version
    attributes:
      label: Game version or package revision
    validations:
      required: true
  - type: input
    id: map_mode
    attributes:
      label: Map, scene, mode, or ruleset
  - type: dropdown
    id: feedback_type
    attributes:
      label: Feedback type
      options:
        - Bug-like behavior
        - Balance
        - Controls
        - UI/HUD
        - Visual clarity
        - Performance
        - Onboarding
        - Content idea
        - Other
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: What happened?
      description: Describe the moment, what you tried, and what felt good or bad.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What would have felt better?
  - type: textarea
    id: evidence
    attributes:
      label: Screenshot, clip, or notes
      description: Add optional evidence with private data removed.
