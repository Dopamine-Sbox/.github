name: Feature request
description: Propose an improvement to a Dopamine-Sbox project
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for this proposal.
          required: true
        - label: This request belongs to this repository rather than the s&box engine itself.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain who needs this and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior, inputs, outputs, and user experience.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or other approaches you considered.
  - type: textarea
    id: evidence
    attributes:
      label: Additional context
      description: Add documentation links, measurements, mockups, or compatibility information.
